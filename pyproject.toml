[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rygnal-core"
version = "0.1.0"
description = "Runtime security and governance control layer for AI agent actions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "PyYAML>=6.0.1",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0"
]

[project.scripts]
rygnal = "rygnal.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.bandit]
exclude_dirs = ["tests"]
skips = []
# Only fail CI on High severity. Low/Medium findings are intentional security
# infrastructure code (bubblewrap subprocess calls, nosec-annotated patterns).
level = "HIGH"
confidence = "HIGH"


[tool.setuptools.packages.find]
where = ["src"]


[project.optional-dependencies]
live-openai = [
    "openai>=1.0.0"
]

[tool.setuptools.package-data]
"rygnal.resources.policies" = ["*.yaml"]
