name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-quality:
    name: Test and quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test Go CLI
        run: go test ./...

      - name: Build Go CLI
        run: go build -o bin/rygnal ./cmd/rygnal

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install rygnal package
        run: pip install -e .

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Rust format check
        run: cargo fmt --manifest-path rust-kernel/Cargo.toml -- --check

      - name: Rust tests
        run: cargo test --manifest-path rust-kernel/Cargo.toml --no-default-features

      - name: Rust clippy
        run: cargo clippy --manifest-path rust-kernel/Cargo.toml --no-default-features -- -D warnings

      - name: Build and install Rust kernel Python extension wheel
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        run: |
          cd rust-kernel
          python -m maturin build --release --out dist
          python -m pip install dist/*.whl

      - name: Ruff lint check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Install Bubblewrap containment backend
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap

      - name: Allow unprivileged user namespaces for Bubblewrap
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          sysctl kernel.unprivileged_userns_clone || true

      - name: Run tests
        run: pytest -q

      - name: Bandit security scan
        run: bandit -r src demo -c pyproject.toml

      - name: Dependency vulnerability audit
        run: pip-audit -r requirements-dev.txt
